name: jaguard
description: "JaGuarD — Plataforma cívico-ambiental para reportar y prevenir conflictos entre humanos y fauna silvestre."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Supabase (Auth, Postgres, Storage) — reemplaza a Firebase
  supabase_flutter: ^2.9.1

  # Mapas y geolocalización (Google Maps API)
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Imágenes
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Selección de archivos (adjuntos del CMS)
  file_picker: ^10.1.2

  # Contenido enriquecido (HTML de guías)
  flutter_widget_from_html_core: ^0.15.1
  url_launcher: ^6.3.1

  # Editor CMS (Quill ↔ HTML)
  flutter_quill: ^11.5.1
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.4.1

  # Datos, exportación y análisis
  fl_chart: ^0.69.2
  syncfusion_flutter_xlsio: ^28.2.9
  http: ^1.2.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1

  # Conectividad y persistencia local (offline-first)
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  shared_preferences: ^2.5.2
  path: ^1.9.0

  # Iconografía (paridad con el diseño web lucide)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/branding/jaguard_app_icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/jaguard_logo_dark_on_light.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/map_styles/
    - assets/branding/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
